{%extends 'layout.html'%}

{%block title%} login {%endblock%}

{%block main%}
<form action="/login" method="post" class="mx-auto mt-4" style="max-width: 400px;">
    <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" class="form-control shadow-none" name="username" placeholder="username" autofocus autocomplete="off" required>
    </div>

    <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input id="password" type="password" class="form-control shadow-none" name="password" placeholder="password" required>
    </div>

    <button type="submit" class="btn btn-primary w-100 mt-3"> Login </button>
</form>
{%endblock%}
