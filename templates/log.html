{% extends "layout.html" %}

{% block title %} Log Meal {% endblock%}

{% block main %}
<h1 class="text-center mb-5">Add a New Meal</h1>
<form action="/log" method="post" class="mx-auto mt-4" style="max-width: 400px;">

    <div class="mb-4">
        <label for="food_name" class="form-label">Food Name</label>
        <input type="text" name="food_name" id="food_name" class="form-control shadow-none" placeholder="enter name of the food" autofocus autocomplete="off" required>
        
    </div>

    <div class="mb-4">
        <label for="calories" class="form-label">Calories</label>
        <input type="number" id="calories" class="form-control shadow-none" name="calories" placeholder="amount of calories" min="0" required>
    </div>

    <div class="mb-4">
        <label for="protein" class="form-label">Protein</label>
        <input type="number" step="0.1" id="protein" class="form-control shadow-none" name="protein" placeholder="amount of protein" min="0" required>
    </div>

    <div class="mb-4">
        <label for="carbs" class="form-label">Carbs</label>
        <input type="number" id="carbs" class="form-control shadow-none" step="0.1" name="carbs" placeholder="amount of carbs" min="0">
    </div>

    <div class="mb-4">
        <label for="fats" class="form-label">Fats</label>
        <input type="number" id="fats" class="form-control shadow-none" step="0.1" name="fats" placeholder="amount of fats" min="0">
    </div>

    <button type="submit" class="btn btn-primary w-100 mt-3"> Add Meal </button>
</form>
{% endblock %}
