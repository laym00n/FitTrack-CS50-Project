{% extends "layout.html" %}

{% block title %} Register {% endblock %}

{%block main %}
<form action="/register" method="post" class="mx-auto mt-4" style="max-width: 400px;">
   <div class="mb-4">
      <label for="username" class="form-label">Username</label>
      <input type="text" name="username" id="username" class="form-control shadow-none" placeholder="username" autofocus autocomplete="off" required>
   </div>

   <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" id="password" class="form-control shadow-none" name="password" placeholder="password" required>
   </div>

   <div class="mb-3">
      <label for="confirmation_password" class="form-label">Confirm Password</label>
      <input type="password" id="confirmation_password" class="form-control shadow-none" name="confirmation_password" placeholder="confirm" required>
   </div>


   <button type="submit" class="btn btn-primary w-100 mt-3">Register</button>
</form>
{% endblock %}
